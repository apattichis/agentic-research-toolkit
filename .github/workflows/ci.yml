name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-tests:
    name: Installer tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      # The installer tests and the image downloader's URL safety tests need only the
      # standard library. The other nature-figure tests need numpy and matplotlib.
      - name: Run installer and URL safety tests
        run: python -I -m pytest tests skills/visuals/nature-figure/tests/test_schematic_url_safety.py -q
